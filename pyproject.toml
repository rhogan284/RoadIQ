[project]
name = "roadiq"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "redis>=5.0",
    "psycopg[binary]>=3.2",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "pillow>=10.4",
    "streamlit>=1.38",
    "pandas>=2.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-timeout>=2.3", "httpx>=0.27"]
# The YOLOv12s detector's runtime. A group, not a core dependency, so the pipeline and
# its tests still install without torch. ultralytics is AGPL-3.0 (Licence Register).
yolo = ["ultralytics>=8.3.100", "torch", "torchvision"]

[tool.uv]
# ultralytics pulls opencv-python (GUI build); two cv2 builds in one env shadow each
# other unpredictably, and the project already depends on the headless one.
override-dependencies = ["opencv-python; sys_platform == 'never'"]

[tool.uv.sources]
# CPU-only torch on Linux (the containers and Joseph's amd64 CI); PyPI's default Linux
# torch wheel drags in ~2.5 GB of CUDA libraries nothing here can use.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edgecv"]

[tool.pytest.ini_options]
# "." lets tests import the top-level `scripts` package (the fixture generator).
# Confined to pytest's import resolution, not production runs. Don't add a
# top-level directory whose name shadows a real dependency.
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = ["integration: requires docker compose services running"]
timeout = 120
