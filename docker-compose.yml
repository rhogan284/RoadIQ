x-app: &app
  build: .
  depends_on:
    redis: {condition: service_healthy}
    postgres: {condition: service_healthy}
  environment:
    PG_DSN: postgresql://edgecv:edgecv@postgres:5432/edgecv
    REDIS_URL: redis://redis:6379/0
    BLOB_ROOT: /blobs
    FRAMES_MAXLEN: "1000"
  volumes:
    - blobs:/blobs
    - ./tests/fixtures/generated:/app/tests/fixtures/generated:ro

services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 15

  postgres:
    # PostGIS >= 3.4: ST_LineSubstring only supports geography from 3.4.0.
    # Pinned, not floating (R-R1). The official postgis/postgis images have no
    # arm64 manifest, so this community multi-arch build is used instead —
    # Joseph's CI (amd64) needs this same image too.
    image: imresamu/postgis:16-3.5-alpine
    environment:
      POSTGRES_USER: edgecv
      POSTGRES_PASSWORD: edgecv
      POSTGRES_DB: edgecv
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edgecv"]
      interval: 2s
      retries: 15

  writer:
    <<: *app
    command: python -m edgecv.writer.main

  worker:
    <<: *app
    # WORKER_ID is unset here on purpose: worker/main.py falls back to
    # worker-<pid>, and each replica is PID 1 in its own container, so a
    # literal worker-1 vs worker-2 split does not happen for free. Give each
    # replica a hostname-derived identity instead so the two consumers in the
    # "workers" group are actually distinct.
    command: sh -c 'WORKER_ID="worker-$$(cat /etc/hostname)" python -m edgecv.worker.main'
    deploy:
      replicas: 2

  feedsim:
    <<: *app
    command: >
      python -m edgecv.feedsim.main
      --frames 600 --fps 15 --prevalence 0.03
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
      writer: {condition: service_started}

  dashboard:
    <<: *app
    command: streamlit run src/edgecv/dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports: ["8501:8501"]

volumes:
  blobs:
