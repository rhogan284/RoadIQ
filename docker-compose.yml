x-app: &app
  build: .
  depends_on:
    redis: {condition: service_healthy}
    postgres: {condition: service_healthy}
  environment:
    PG_DSN: postgresql://edgecv:edgecv@postgres:5432/edgecv
    REDIS_URL: redis://redis:6379/0
    # Overridable so a measurement run can own a fresh store: bytes-per-km
    # totals the store, and snippets carry no run linkage, so a store shared
    # across runs cannot be attributed to one. `BLOB_ROOT=/blobs/m2-01 make
    # bench-bytes` is the practical workaround until a run_snippets join
    # table exists.
    BLOB_ROOT: ${BLOB_ROOT:-/blobs}
    # Overridable so a benchmark sweep can vary the buffer depth: the whole
    # point of a bounded stream is that its depth is a tuning parameter, and
    # forcing drops on purpose is how the coverage-gap reporting gets exercised.
    FRAMES_MAXLEN: "${FRAMES_MAXLEN:-1000}"
    # Frames are served back to the dashboard only from under this directory.
    FRAME_ROOT: /app/data
  volumes:
    - blobs:/blobs
    - ./tests/fixtures/generated:/app/tests/fixtures/generated:ro
    # RDD2022 (make dataset) and the model weights (make weights). Read-only: the
    # dataset is evidence, and nothing in the pipeline has a reason to write to it.
    - ./data:/app/data:ro
    - ./weights:/app/weights:ro

services:
  redis:
    image: redis:7-alpine
    ports: ["${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 15

  postgres:
    # PostGIS >= 3.4: ST_LineSubstring only supports geography from 3.4.0.
    # Pinned, not floating (R-R1). The official postgis/postgis images have no
    # arm64 manifest, so this community multi-arch build is used instead —
    # Joseph's CI (amd64) needs this same image too.
    image: imresamu/postgis:16-3.5-alpine
    environment:
      POSTGRES_USER: edgecv
      POSTGRES_PASSWORD: edgecv
      POSTGRES_DB: edgecv
    ports: ["${PG_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edgecv"]
      interval: 2s
      retries: 15

  writer:
    <<: *app
    command: python -m edgecv.writer.main

  worker:
    <<: *app
    # WORKER_ID is unset here on purpose: worker/main.py falls back to
    # worker-<pid>, and each replica is PID 1 in its own container, so a
    # literal worker-1 vs worker-2 split does not happen for free. Give each
    # replica a hostname-derived identity instead so the two consumers in the
    # "workers" group are actually distinct.
    command: sh -c 'WORKER_ID="worker-$$(cat /etc/hostname)" python -m edgecv.worker.main'
    environment:
      PG_DSN: postgresql://edgecv:edgecv@postgres:5432/edgecv
      REDIS_URL: redis://redis:6379/0
      BLOB_ROOT: ${BLOB_ROOT:-/blobs}
      FRAMES_MAXLEN: "${FRAMES_MAXLEN:-1000}"
      # Shervin's detector by default. DETECTOR=threshold restores the classical
      # baseline; YOLO_WEIGHTS=weights/yolo12s_rdd2022_continued.pt swaps in his v4.
      DETECTOR: ${DETECTOR:-yolo12s}
      YOLO_WEIGHTS: ${YOLO_WEIGHTS:-weights/yolo12s_RDD2022_best.pt}
      # Two replicas each defaulting to every core thrash each other; split them.
      OMP_NUM_THREADS: "${WORKER_THREADS:-6}"
    deploy:
      replicas: ${WORKERS:-2}

  feedsim:
    <<: *app
    command: >
      python -m edgecv.feedsim.main
      --frames 600 --fps 15 --prevalence 0.03
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
      writer: {condition: service_started}

  # Measurement harness, not a long-running service: `make bench-bytes` runs it
  # once. It needs the blobs volume, which is why it is a compose service at all
  # rather than a host script -- the store lives in the volume, not the repo.
  bench:
    <<: *app
    profiles: ["tools"]
    command: python -m edgecv.bench.main

  # Component 11. Always-on: re-segments any run whose results moved since its last
  # pass (16 Sep decision: the system is always-on, segmentation is its own component).
  segmenter:
    <<: *app
    command: python -m edgecv.segmenter.main

  # Runs the dashboard's "New run" requests (feed-sim → drain → segmenter → bench).
  # Its own container so an API redeploy can't kill a run mid-feed; the API only queues.
  runner:
    <<: *app
    command: python -m edgecv.runner --serve

  # Component 7 (read API) + component 8 (the product dashboard, served at /).
  api:
    <<: *app
    command: uvicorn edgecv.api.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]

  # Component 12 — pipeline observability (coverage + bus health). No longer the
  # product dashboard; that is the api service's page on :8000.
  dashboard:
    <<: *app
    command: streamlit run src/edgecv/dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports: ["8501:8501"]

volumes:
  blobs:
